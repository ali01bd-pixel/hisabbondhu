            { bn: 'অন্যান্য আয়', en: 'Other Income' },
            { bn: '+ কাস্টম ক্যাটাগরি...', en: '+ Custom Category...' }
          ];

          const defaultState = {
            lang: 'bn',
            currency: '৳',
            dark: false,
            pin: '',
            monthlyBudget: 0,
            wallets: defaultWallets,
            transactions: [],
            loans: [],
            shopping: []
          };

          let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || JSON.parse(JSON.stringify(defaultState));
          document.getElementById('txDate').value = getLocalDateStr();

          function walletDisplayName(w) {
            if (!w) return '';
            return db.lang === 'en' ? (w.nameEn || w.nameBn) : (w.nameBn || w.nameEn);
          }

          function saveDB() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            renderAll();
          }

          function fmt(num) {
            const n = Number(num || 0);
            const locale = db.lang === 'bn' ? 'bn-BD' : 'en-US';
            return db.currency + ' ' + n.toLocaleString(locale, { maximumFractionDigits: 2 });
          }

          function openQuickTxModal(defaultType = 'EXPENSE') {
            document.getElementById('txType').value = defaultType;
            document.getElementById('txDate').value = getLocalDateStr();
            updateCategorySuggestions();
            document.getElementById('quickTxModal').classList.remove('hidden');
          }

          function closeQuickTxModal() {
            document.getElementById('quickTxModal').classList.add('hidden');
          }

          function updateCategorySuggestions() {
            const type = document.getElementById('txType').value;
            const list = type === 'INCOME' ? incomeCategories : expenseCategories;
            const sel = document.getElementById('txCategorySelect');
            sel.innerHTML = list.map((c, idx) =>
              `<option value="${idx}">${db.lang === 'en' ? c.en : c.bn}</option>`
            ).join('');
            syncCustomCategoryInput();
          }

          function syncCustomCategoryInput() {
            const type = document.getElementById('txType').value;
            const list = type === 'INCOME' ? incomeCategories : expenseCategories;
            const idx = parseInt(document.getElementById('txCategorySelect').value) || 0;
            const isCustom = idx === list.length - 1;
            document.getElementById('txCategoryCustom').classList.toggle('hidden', !isCustom);
          }

          function showSection(sec, btn) {
            activeSection = sec;
            ['home','transactions','loans','shopping','reports','wallets','settings'].forEach(s => {
              document.getElementById('sec_' + s).classList.add('hidden');
            });
            document.getElementById('sec_' + sec).classList.remove('hidden');
            if (btn) {
              document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }

          function setRange(r, btn) {
            currentRange = r;
            document.querySelectorAll('#sec_home .chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            renderAll();
          }

          function addTransaction() {
            const type = document.getElementById('txType').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            const list = type === 'INCOME' ? incomeCategories : expenseCategories;
            const catIdx = parseInt(document.getElementById('txCategorySelect').value) || 0;
            let category = db.lang === 'en' ? list[catIdx].en : list[catIdx].bn;
            if (catIdx === list.length - 1) {
              category = document.getElementById('txCategoryCustom').value.trim() || (type === 'INCOME' ? 'Other Income' : 'Other Expense');
            }
            const walletId = parseInt(document.getElementById('txAccount').value);
            const dateStr = document.getElementById('txDate').value || getLocalDateStr();
            const note = document.getElementById('txNote').value.trim();

            if (!amount || amount <= 0) return showToast('সঠিক টাকার পরিমাণ লিখুন!');
            const wallet = db.wallets.find(w => w.id === walletId);
            if (!wallet) return;

            wallet.balance += (type === 'INCOME' ? amount : -amount);
            db.transactions.unshift({
              id: Date.now(), type, amount, category, walletId,
              walletName: walletDisplayName(wallet), date: dateStr, note
            });
            document.getElementById('txAmount').value = '';
            document.getElementById('txNote').value = '';
            document.getElementById('txCategoryCustom').value = '';
            closeQuickTxModal();
            saveDB();
            showToast('লেনদেন সংরক্ষিত হয়েছে!');
          }

          function deleteTx(id) {
            openModal({
              title: 'লেনদেন মুছে ফেলবেন?',
              msg: 'এই লেনদেনটি মুছে ফেলা হবে এবং ওয়ালেট ব্যালেন্স স্বয়ংক্রিয়ভাবে সমন্বয় করা হবে।',
              showInput: false,
              onConfirm: () => {
                const idx = db.transactions.findIndex(t => t.id === id);
                if (idx === -1) return;
                const tx = db.transactions[idx];
                const wallet = db.wallets.find(w => w.id === tx.walletId);
                if (wallet) wallet.balance += (tx.type === 'INCOME' ? -tx.amount : tx.amount);
                db.shopping.forEach(item => {
                  if (item.linkedTxId === id) {
                    item.purchased = false;
                    item.linkedTxId = null;
                  }
                });
                db.transactions.splice(idx, 1);
                saveDB();
                showToast('মুছে ফেলা হয়েছে!');
              }
            });
          }

          function transferWallet() {
            const fromId = parseInt(document.getElementById('trFrom').value);
            const toId = parseInt(document.getElementById('trTo').value);
            const amt = parseFloat(document.getElementById('trAmount').value);
            if (fromId === toId || !amt || amt <= 0) {
              return showToast('দুটি ভিন্ন ওয়ালেট এবং সঠিক টাকার পরিমাণ দিন!');
            }
            const wFrom = db.wallets.find(w => w.id === fromId);
            const wTo = db.wallets.find(w => w.id === toId);
            if (!wFrom || !wTo) return;
            wFrom.balance -= amt;
            wTo.balance += amt;
            document.getElementById('trAmount').value = '';
            saveDB();
            showToast('ওয়ালেট ট্রান্সফার সম্পন্ন হয়েছে!');
          }

          function addWallet() {
            const name = document.getElementById('newWalletName').value.trim();
            const bal = parseFloat(document.getElementById('newWalletBal').value) || 0;
            if (!name) return showToast('ওয়ালেটের নাম লিখুন!');
            db.wallets.push({ id: Date.now(), nameBn: name, nameEn: name, color: '#0D9488', icon: '💼', balance: bal });
            document.getElementById('newWalletName').value = '';
            document.getElementById('newWalletBal').value = '';
            saveDB();
            showToast('নতুন ওয়ালেট যুক্ত হয়েছে!');
          }

          function editWalletBalance(id) {
            const w = db.wallets.find(x => x.id === id);
            if (!w) return;
            openModal({
              title: walletDisplayName(w),
              msg: 'এই অ্যাকাউন্টে বর্তমানে প্রকৃত কত টাকা আছে তা লিখুন:',
              showInput: true,
              defaultValue: w.balance,
              onConfirm: (val) => {
                const num = parseFloat(val);
                if (!isNaN(num)) {
                  w.balance = num;
                  saveDB();
                  showToast('ওয়ালেট ব্যালেন্স আপডেট হয়েছে!');
                }
              }
            });
          }

          // Debtor & Creditor Strictly Isolated from Main Balance
          function addLoan() {
            const type = document.getElementById('loanType').value;
            const person = document.getElementById('loanPerson').value.trim();
            const phone = document.getElementById('loanPhone').value.trim();
            const amount = parseFloat(document.getElementById('loanAmount').value);
            const due = document.getElementById('loanDue').value;
            const note = document.getElementById('loanNote').value.trim();

            if (!person || !amount || amount <= 0) {
              return showToast('ব্যক্তির নাম এবং সঠিক টাকার পরিমাণ দিন!');
            }
            db.loans.unshift({
              id: Date.now(), type, person, phone, principal: amount,
              paid: 0, due, note, notified: false, history: []
            });
            document.getElementById('loanPerson').value = '';
            document.getElementById('loanPhone').value = '';
            document.getElementById('loanAmount').value = '';
            document.getElementById('loanNote').value = '';
            saveDB();
            showToast(type === 'RECEIVABLE' ? 'দেনাদার সংরক্ষিত হয়েছে!' : 'পাওনাদার সংরক্ষিত হয়েছে!');
          }

          function payLoanPartial(id) {
            const loan = db.loans.find(l => l.id === id);
            if (!loan) return;
            const rem = Math.max(0, loan.principal - loan.paid);
            if (rem <= 0) return;

            openModal({
              title: loan.type === 'RECEIVABLE'
                ? `দেনাদার (${loan.person}) থেকে আদায়`
                : `পাওনাদার (${loan.person})-কে পরিশোধ`,
              msg: `বকেয়া রয়েছে: ${fmt(rem)}। কত টাকা কিস্তি বা পরিশোধ জমা করতে চান?`,
              showInput: true,
              defaultValue: rem,
              onConfirm: (val) => {
                const rawAmt = parseFloat(val);
                if (isNaN(rawAmt) || rawAmt <= 0) return;
                const actualPaid = Math.min(rem, rawAmt);
                loan.paid += actualPaid;
                if (!Array.isArray(loan.history)) loan.history = [];
                loan.history.push({ date: getLocalDateStr(), amount: actualPaid });
                saveDB();
                showToast('কিস্তি / পরিশোধ আপডেট হয়েছে!');
              }
            });
          }

          function deleteLoan(id) {
            openModal({
              title: 'রেকর্ড মুছে ফেলবেন?',
              msg: 'আপনি কি নিশ্চিতভাবে এই দেনাদার/পাওনাদারের হিসাবটি মুছে ফেলতে চান?',
              showInput: false,
              onConfirm: () => {
                db.loans = db.loans.filter(l => l.id !== id);
                saveDB();
                showToast('রেকর্ড মুছে ফেলা হয়েছে!');
              }
            });
          }

          function addShoppingItem() {
            const name = document.getElementById('shopName').value.trim();
            const qty = document.getElementById('shopQty').value.trim() || '1';
            const est = parseFloat(document.getElementById('shopPrice').value) || 0;
            const walletId = parseInt(document.getElementById('shopAccount').value);
            if (!name) return showToast('পণ্যের নাম লিখুন!');
            db.shopping.unshift({
              id: Date.now(), name, qty, est, actual: est, walletId, purchased: false, linkedTxId: null
            });
            document.getElementById('shopName').value = '';
            document.getElementById('shopPrice').value = '';
            saveDB();
            showToast('বাজারের তালিকায় যুক্ত হয়েছে!');
          }

          function toggleShoppingItem(id) {
            const item = db.shopping.find(s => s.id === id);
            if (!item) return;
            if (!item.purchased) {
              if (item.linkedTxId) return;
              openModal({
                title: `কেনা সম্পন্ন: ${item.name}`,
                msg: 'পণ্যটির প্রকৃত ক্রয়মূল্য কত হয়েছে? (সংশ্লিষ্ট ওয়ালেট থেকে স্বয়ংক্রিয়ভাবে ব্যয় হবে)',
                showInput: true,
                defaultValue: item.est,
                onConfirm: (val) => {
                  const actualPrice = parseFloat(val);
                  if (isNaN(actualPrice) || actualPrice < 0) {
                    renderAll();
                    return;
                  }
                  const wallet = db.wallets.find(w => w.id === item.walletId) || db.wallets[0];
                  wallet.balance -= actualPrice;
                  const txId = Date.now();
                  db.transactions.unshift({
                    id: txId, type: 'EXPENSE', amount: actualPrice,
                    category: 'কেনাকাটা (Shopping)',
                    walletId: wallet.id, walletName: walletDisplayName(wallet),
                    date: getLocalDateStr(), note: item.name + ' (' + item.qty + ')'
                  });
                  item.purchased = true;
                  item.actual = actualPrice;
                  item.linkedTxId = txId;
                  saveDB();
                  showToast('বাজারের ব্যয় মেইন ব্যালেন্সে সমন্বয় হয়েছে!');
                }
              });
              renderAll();
            } else {
              openModal({
                title: 'পণ্য আনচেক করবেন?',
                msg: 'এটি আনচেক করলে এর সাথে যুক্ত ব্যয়ের হিসাবটি মুছে টাকা ওয়ালেটে ফেরত যাবে। নিশ্চিত?',
                showInput: false,
                onConfirm: () => {
                  if (item.linkedTxId) {
                    const idx = db.transactions.findIndex(t => t.id === item.linkedTxId);
                    if (idx !== -1) {
                      const tx = db.transactions[idx];
                      const wallet = db.wallets.find(w => w.id === tx.walletId);
                      if (wallet) wallet.balance += tx.amount;
                      db.transactions.splice(idx, 1);
                    }
                    item.linkedTxId = null;
                  }
                  item.purchased = false;
                  saveDB();
                  showToast('পূর্বাবস্থায় ফেরত নেওয়া হয়েছে!');
                }
              });
              renderAll();
            }
          }

          function deleteShoppingItem(id) {
            const item = db.shopping.find(s => s.id === id);
            if (!item) return;
            openModal({
              title: 'পণ্য মুছে ফেলবেন?',
              msg: item.purchased
                ? 'এই পণ্যটি কেনা হয়েছিল। মুছে ফেললে এর ব্যয়টিও ওয়ালেটে ফেরত যাবে।'
                : 'তালিকা থেকে এই পণ্যটি মুছে ফেলতে চান?',
              showInput: false,
              onConfirm: () => {
                if (item.purchased && item.linkedTxId) {
                  const idx = db.transactions.findIndex(t => t.id === item.linkedTxId);
                  if (idx !== -1) {
                    const tx = db.transactions[idx];
                    const wallet = db.wallets.find(w => w.id === tx.walletId);
                    if (wallet) wallet.balance += tx.amount;
                    db.transactions.splice(idx, 1);
                  }
                }
                db.shopping = db.shopping.filter(s => s.id !== id);
                saveDB();
              }
            });
          }

          function setLang(l) {
            db.lang = (l === 'en') ? 'en' : 'bn';
            updateCategorySuggestions();
            saveDB();
          }
          function changeCurrency(c) { db.currency = c; saveDB(); }
          function toggleDark() { db.dark = !db.dark; saveDB(); }
          function saveBudget() {
            db.monthlyBudget = parseFloat(document.getElementById('budgetLimitInput').value) || 0;
            saveDB();
            showToast('মাসিক বাজেট সংরক্ষিত হয়েছে!');
          }
          function savePin() {
            db.pin = document.getElementById('newPinInput').value.trim();
            saveDB();
            showToast(db.pin ? 'পিন লক চালু হয়েছে!' : 'পিন লক বন্ধ করা হয়েছে!');
          }
          function unlockApp() {
            if (document.getElementById('pinUnlockInput').value === db.pin) {
              document.getElementById('lockScreen').classList.add('hidden');
            } else {
              showToast('ভুল পিন দিয়েছেন!');
            }
          }

          function downloadBackup() {
            const filename = `HisabBondhu_Backup_${getLocalDateStr()}.json`;
            const content = JSON.stringify(db, null, 2);
            if (window.AndroidBridge && window.AndroidBridge.saveFile) {
              window.AndroidBridge.saveFile(filename, content, 'application/json');
            } else {
              const blob = new Blob([content], { type: 'application/json' });
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = filename;
              a.click();
            }
          }

          function restoreBackup(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
              try {
                const parsed = JSON.parse(evt.target.result);
                if (parsed.wallets && parsed.transactions) {
                  db = parsed;
                  saveDB();
                  showToast('ব্যাকআপ সফলভাবে রিস্টোর হয়েছে!');
                }
              } catch (err) {
                showToast('সঠিক ব্যাকআপ ফাইল নয়!');
              }
            };
            reader.readAsText(file);
          }

          function exportCSV() {
            const filename = `HisabBondhu_Transactions_${getLocalDateStr()}.csv`;
            let csv = 'Date,Type,Category,Wallet,Amount,Note\n';
            db.transactions.forEach(t => {
              csv += `${t.date},${t.type},"${t.category}","${t.walletName}",${t.amount},"${(t.note || '').replace(/"/g, "'")}"\n`;
            });
            if (window.AndroidBridge && window.AndroidBridge.saveFile) {
              window.AndroidBridge.saveFile(filename, csv, 'text/csv');
            } else {
              const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = filename;
              a.click();
            }
          }

          function printReport() {
            if (window.AndroidBridge && window.AndroidBridge.printPdfReport) {
              window.AndroidBridge.printPdfReport();
            } else {
              window.print();
            }
          }

          function checkDueReminders() {
            const now = new Date();
            const dueLoans = db.loans.filter(l => {
              const rem = l.principal - l.paid;
              return rem > 0 && l.due && new Date(l.due) <= now;
            });
            const banner = document.getElementById('dueReminderBanner');
            if (dueLoans.length > 0) {
              banner.classList.remove('hidden');
              const names = dueLoans.map(l => `${l.person} (${fmt(l.principal - l.paid)})`).join(', ');
              banner.innerText = `⏰ রিমাইন্ডার (নির্ধারিত সময় পূর্ণ হয়েছে): ${names}`;
              dueLoans.forEach(l => {
                if (!l.notified && window.AndroidBridge && window.AndroidBridge.showNotification) {
                  window.AndroidBridge.showNotification(
                    'HisabBondhu রিমাইন্ডার',
                    `${l.person} — বাকি টাকা: ${fmt(l.principal - l.paid)}`
                  );
                  l.notified = true;
                  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
                }
              });
            } else {
              banner.classList.add('hidden');
            }
          }

          function renderAll() {
            document.body.classList.toggle('dark', !!db.dark);
            document.getElementById('langChip_bn').classList.toggle('active', db.lang === 'bn');
            document.getElementById('langChip_en').classList.toggle('active', db.lang === 'en');
            document.getElementById('currencySelect').value = db.currency;

            const walletOpts = db.wallets.map(w => `<option value="${w.id}">${walletDisplayName(w)} (${fmt(w.balance)})</option>`).join('');
            ['txAccount','shopAccount','trFrom','trTo'].forEach(id => {
              const el = document.getElementById(id);
              if (el) {
                const prev = el.value;
                el.innerHTML = walletOpts;
                if (prev && db.wallets.some(w => String(w.id) === String(prev))) el.value = prev;
              }
            });

            document.getElementById('homeWalletStrip').innerHTML = db.wallets.map(w => `
              <div class="wallet-pill" onclick="editWalletBalance(${w.id})">
                <div class="w-badge" style="background:${w.color || '#006C4C'}">${w.icon || '৳'}</div>
                <small>${walletDisplayName(w)}</small>
                <strong>${fmt(w.balance)}</strong>
              </div>
            `).join('');

            const todayStr = getLocalDateStr();
            const monthPrefix = todayStr.slice(0, 7);
            const yearPrefix = todayStr.slice(0, 4);

            const filteredTx = db.transactions.filter(tx => {
              if (currentRange === 'TODAY') return tx.date === todayStr;
              if (currentRange === 'MONTH') return tx.date.startsWith(monthPrefix);
              if (currentRange === 'YEAR') return tx.date.startsWith(yearPrefix);
              return true;
            });

            const totalBal = db.wallets.reduce((s, w) => s + w.balance, 0);
            const inc = filteredTx.filter(x => x.type === 'INCOME').reduce((s, x) => s + x.amount, 0);
            const exp = filteredTx.filter(x => x.type === 'EXPENSE').reduce((s, x) => s + x.amount, 0);
            const todayInc = db.transactions.filter(x => x.type === 'INCOME' && x.date === todayStr).reduce((s, x) => s + x.amount, 0);
            const todayExp = db.transactions.filter(x => x.type === 'EXPENSE' && x.date === todayStr).reduce((s, x) => s + x.amount, 0);

            const receivableTotal = db.loans.filter(l => l.type === 'RECEIVABLE').reduce((s, l) => s + Math.max(0, l.principal - l.paid), 0);
            const payableTotal = db.loans.filter(l => l.type === 'PAYABLE').reduce((s, l) => s + Math.max(0, l.principal - l.paid), 0);

            document.getElementById('val_totalBalance').innerText = fmt(totalBal);
            document.getElementById('val_totalInc').innerText = fmt(inc);
            document.getElementById('val_totalExp').innerText = fmt(exp);
            document.getElementById('val_todayInc').innerText = fmt(todayInc);
            document.getElementById('val_todayExp').innerText = fmt(todayExp);
            document.getElementById('val_receivable').innerText = fmt(receivableTotal);
            document.getElementById('val_payable').innerText = fmt(payableTotal);
            document.getElementById('val_loanTabReceivable').innerText = fmt(receivableTotal);
            document.getElementById('val_loanTabPayable').innerText = fmt(payableTotal);

            const monthExp = db.transactions.filter(x => x.type === 'EXPENSE' && x.date.startsWith(monthPrefix)).reduce((s, x) => s + x.amount, 0);
            document.getElementById('val_budgetText').innerText = `${fmt(monthExp)} / ${fmt(db.monthlyBudget)}`;
            const pct = db.monthlyBudget > 0 ? Math.min(100, Math.round((monthExp / db.monthlyBudget) * 100)) : 0;
            const bar = document.getElementById('budgetBar');
            bar.style.width = pct + '%';
            bar.style.background = pct >= 100 ? 'var(--expense)' : pct >= 80 ? 'var(--creditor)' : 'var(--income)';
            document.getElementById('budgetAlert').innerText =
              pct >= 100 ? '⚠️ সতর্কতা: মাসিক বাজেট ১০০% অতিক্রম করেছে!' :
              pct >= 80 ? '⚠️ সতর্কতা: মাসিক বাজেটের ৮০% খরচ হয়েছে!' : '';

            document.getElementById('homeRecentTxContainer').innerHTML = db.transactions.slice(0, 5).map(x => `
              <div class="tx-row">
                <div>
                  <strong>${x.category}</strong> <small style="color:var(--muted);">(${x.walletName})</small><br>
                  <small style="color:var(--muted);">${x.date} ${x.note ? '• ' + x.note : ''}</small>
                </div>
                <span class="${x.type === 'INCOME' ? 'stat-inc' : 'stat-exp'}" style="font-size:15px;">
                  ${x.type === 'INCOME' ? '+' : '-'}${fmt(x.amount)}
                </span>
              </div>
            `).join('') || '<small style="color:var(--muted);">এখনও কোনো আয় বা ব্যয় যোগ করা হয়নি।</small>';

            const q = (document.getElementById('searchTx').value || '').toLowerCase();
            document.getElementById('txListContainer').innerHTML = db.transactions
              .filter(x => !q || x.category.toLowerCase().includes(q) || (x.walletName||'').toLowerCase().includes(q) || (x.note||'').toLowerCase().includes(q) || String(x.amount).includes(q) || (x.date||'').includes(q))
              .map(x => `
                <div class="tx-row">
                  <div>
                    <strong>${x.category}</strong> <small style="color:var(--muted);">(${x.walletName})</small><br>
                    <small style="color:var(--muted);">${x.date} ${x.note ? '• ' + x.note : ''}</small>
                  </div>
                  <div style="text-align:right;white-space:nowrap;">
                    <span class="${x.type === 'INCOME' ? 'stat-inc' : 'stat-exp'}" style="font-size:15px;">${x.type === 'INCOME' ? '+' : '-'}${fmt(x.amount)}</span>
                    <button class="btn-danger" style="margin-left:6px;" onclick="deleteTx(${x.id})">✕</button>
                  </div>
                </div>
              `).join('') || '<small style="color:var(--muted);">কোনো লেনদেন পাওয়া যায়নি।</small>';

            const lf = document.getElementById('loanFilter').value;
            document.getElementById('loanListContainer').innerHTML = db.loans
              .filter(l => lf === 'ALL' || l.type === lf)
              .map(l => {
                const rem = Math.max(0, l.principal - l.paid);
                const isDebtor = l.type === 'RECEIVABLE';
                const badgeClass = isDebtor ? 'badge-debtor' : 'badge-creditor';
                const badgeLabel = isDebtor ? 'দেনাদার (আমি পাবো)' : 'পাওনাদার (আমার কাছে পাবে)';
                const actionLabel = isDebtor ? 'আদায় এন্ট্রি' : 'পরিশোধ এন্ট্রি';
                const histText = Array.isArray(l.history) && l.history.length > 0
                  ? `<br><small style="color:var(--income);">কিস্তি জমা: ${l.history.map(h => `${fmt(h.amount)} (${h.date})`).join(', ')}</small>`
                  : '';
                return `
                  <div class="tx-row">
                    <div>
                      <strong>${l.person}</strong> <span class="badge ${badgeClass}">${badgeLabel}</span>
                      ${l.phone ? `<small style="color:var(--muted);"> • 📞 ${l.phone}</small>` : ''}<br>
                      <small>বাকি: <strong>${fmt(rem)}</strong> / মোট: ${fmt(l.principal)} ${l.due ? '• ⏰ ' + l.due.replace('T',' ') : ''}</small>
                      ${l.note ? `<br><small style="color:var(--muted);">${l.note}</small>` : ''}
                      ${histText}
                    </div>
                    <div style="white-space:nowrap;">
                      ${rem > 0 ? `<button class="btn-outline" onclick="payLoanPartial(${l.id})">${actionLabel}</button>` : `<strong style="color:var(--income)">পরিশোধিত</strong>`}
                      <button class="btn-danger" style="margin-left:4px;" onclick="deleteLoan(${l.id})">✕</button>
                    </div>
                  </div>
                `;
              }).join('') || '<small style="color:var(--muted);">কোনো দেনাদার বা পাওনাদারের রেকর্ড নেই।</small>';

            const estSum = db.shopping.reduce((s, i) => s + i.est, 0);
            const actSum = db.shopping.filter(i => i.purchased).reduce((s, i) => s + i.actual, 0);
            document.getElementById('val_shopEst').innerText = fmt(estSum);
            document.getElementById('val_shopAct').innerText = fmt(actSum);
            document.getElementById('shopListContainer').innerHTML = db.shopping.map(item => `
              <div class="tx-row">
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;">
                  <input type="checkbox" style="width:18px;height:18px;margin:0;" ${item.purchased ? 'checked' : ''} onchange="toggleShoppingItem(${item.id})">
                  <span><strong>${item.name}</strong> (${item.qty}) — <small>${fmt(item.est)}</small></span>
                </label>
                <div style="white-space:nowrap;">
                  <strong style="color:var(--income)">${item.purchased ? fmt(item.actual) : ''}</strong>
                  <button class="btn-danger" style="margin-left:6px;" onclick="deleteShoppingItem(${item.id})">✕</button>
                </div>
              </div>
            `).join('') || '<small style="color:var(--muted);">বাজারের তালিকা খালি।</small>';

            document.getElementById('walletListContainer').innerHTML = db.wallets.map(w => `
              <div class="tx-row">
                <div style="display:flex;align-items:center;gap:10px;">
                  <div style="width:32px;height:32px;border-radius:9px;background:${w.color || '#006C4C'};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;">
                    ${w.icon || '৳'}
                  </div>
                  <strong>${walletDisplayName(w)}</strong>
                </div>
                <div>
                  <strong>${fmt(w.balance)}</strong>
                  <button class="btn-outline" style="margin-left:8px;" onclick="editWalletBalance(${w.id})">✎ এডিট</button>
                </div>
              </div>
            `).join('');

            const catMap = {};
            filteredTx.filter(x => x.type === 'EXPENSE').forEach(x => {
              catMap[x.category] = (catMap[x.category] || 0) + x.amount;
            });
            document.getElementById('reportSummaryText').innerHTML = `
              • মেইন ব্যালেন্স (সকল ওয়ালেট ও ক্যাশ): <strong>${fmt(totalBal)}</strong><br>
              • নিট সঞ্চয় (আয় - ব্যয়): <strong>${fmt(inc - exp)}</strong><br>
              • আলাদা খাতা — মোট দেনাদার (আমি পাবো): <strong style="color:var(--debtor);">${fmt(receivableTotal)}</strong> | মোট পাওনাদার (পাবে): <strong style="color:var(--creditor);">${fmt(payableTotal)}</strong>
            `;

            const totalCatExp = Object.values(catMap).reduce((a, b) => a + b, 0) || 1;
            document.getElementById('categoryBreakdownContainer').innerHTML = Object.entries(catMap)
              .sort((a,b) => b[1] - a[1])
              .map(([k,v]) => {
                const p = Math.round((v / totalCatExp) * 100);
                return `
                  <div style="margin-bottom:10px;">
                    <div style="display:flex;justify-content:space-between;font-size:13px;">
                      <span><strong>${k}</strong> (${p}%)</span>
                      <strong>${fmt(v)}</strong>
                    </div>
                    <div class="progress-bar" style="height:6px;margin:4px 0 0 0;">
                      <div class="progress-fill" style="width:${p}%;background:var(--expense);"></div>
                    </div>
                  </div>
                `;
              }).join('') || '<small style="color:var(--muted);">এখনও কোনো ব্যয়ের ক্যাটাগরি বিশ্লেষণ নেই।</small>';

            checkDueReminders();
          }

          if (db.pin) document.getElementById('lockScreen').classList.remove('hidden');
          updateCategorySuggestions();
          renderAll();
          setInterval(checkDueReminders, 60000);
          </script>
          </body>
          </html>
          EOF

      - name: 5. Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 6. Compile Android APK
        run: gradle assembleDebug --stacktrace

      - name: 7. Prepare Output APK
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/HisabBondhu-v3.0-Pro.apk

      - name: 8. Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HisabBondhu-v3.0-Pro-APK
          path: output_apk/HisabBondhu-v3.0-Pro.apk
          if-no-files-found: error

      - name: 9. Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: "HisabBondhu v3.0 Pro APK (Build #${{ github.run_number }})"
          body: "হিসাববন্ধু (HisabBondhu v3.0 Pro) অ্যাপের সরাসরি ইনস্টলযোগ্য অ্যান্ড্রয়েড APK ফাইল। নিচের Assets থেকে HisabBondhu-v3.0-Pro.apk ডাউনলোড করে সরাসরি আপনার ফোনে ইনস্টল করুন।"
          files: output_apk/HisabBondhu-v3.0-Pro.apk
