                <button class="btn" style="flex:1;" id="modalConfirmBtn">নিশ্চিত করুন</button>
              </div>
            </div>
          </div>

          <div id="quickTxModal" class="modal-backdrop hidden">
            <div class="modal-box">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <strong id="t_quickAdd">নতুন আয় বা ব্যয় যোগ করুন</strong>
                <button class="btn-outline" onclick="closeQuickTxModal()">✕</button>
              </div>
              <select id="txType" onchange="updateCategorySuggestions()">
