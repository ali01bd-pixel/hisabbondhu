          <script>
          const STORAGE_KEY = 'hisabbondhu_db_v3_pro';
          let currentRange = 'ALL';
          let activeSection = 'home';

          function handleAndroidBack() {
            if (!document.getElementById('customModal').classList.contains('hidden')) {
              closeModal();
              return true;
            }
            if (!document.getElementById('quickTxModal').classList.contains('hidden')) {
              closeQuickTxModal();
              return true;
            }
            if (activeSection !== 'home') {
              showSection('home', document.getElementById('navBtn_home'));
              return true;
            }
            return false;
          }

          function getLocalDateStr(d = new Date()) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
          }

          function showToast(msg) {
            const bar = document.getElementById('toastBar');
            bar.innerText = msg;
            bar.classList.remove('hidden');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => bar.classList.add('hidden'), 2600);
          }

          let modalCallback = null;
          function openModal({ title, msg, showInput = false, defaultValue = '', onConfirm }) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMsg').innerText = msg || '';
            const inp = document.getElementById('modalInput');
            if (showInput) {
              inp.classList.remove('hidden');
              inp.value = defaultValue;
              setTimeout(() => inp.focus(), 80);
            } else {
              inp.classList.add('hidden');
            }
            modalCallback = onConfirm;
            document.getElementById('customModal').classList.remove('hidden');
          }

          function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
            modalCallback = null;
          }

          document.getElementById('modalConfirmBtn').onclick = function () {
            const val = document.getElementById('modalInput').value;
            const cb = modalCallback;
