            { id: 2, nameBn: 'ব্যাংক অ্যাকাউন্ট', nameEn: 'Bank Account', color: '#3B82F6', icon: '🏦', balance: 0 },
            { id: 3, nameBn: 'বিকাশ (bKash)', nameEn: 'bKash', color: '#E11D48', icon: 'ব', balance: 0 },
            { id: 4, nameBn: 'নগদ ওয়ালেট (Nagad)', nameEn: 'Nagad', color: '#EA580C', icon: 'ন', balance: 0 },
            { id: 5, nameBn: 'রকেট (Rocket)', nameEn: 'Rocket', color: '#7C3AED', icon: 'র', balance: 0 },
