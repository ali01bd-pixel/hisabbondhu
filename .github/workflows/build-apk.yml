              position: fixed; inset: 0; background: var(--bg); z-index: 900;
              display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px;
            }
            .due-banner {
              background: var(--creditor-bg); border: 1px solid var(--creditor);
              color: var(--text); padding: 10px 14px; border-radius: 14px;
              margin-bottom: 12px; font-size: 12px; font-weight: 600;
            }
          </style>
          </head>
          <body>

