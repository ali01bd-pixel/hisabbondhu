name: Build HisabBondhu v3.0 Pro APK (All-in-One)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Auto-Generate Project & Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK (API 35)
        uses: android-actions/setup-android@v3

      - name: 4. Generate Complete Android Project & v3.0 Pro Source Files
        run: |
          mkdir -p app/src/main/java/com/hisabbondhu/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HisabBondhu"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.hisabbondhu.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.hisabbondhu.app"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 3
                  versionName = "3.0.0"
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.9.1")
              implementation("androidx.webkit:webkit:1.11.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="HisabBondhu"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#005A3F" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#003826" android:pathData="M0,74 Q54,54 108,82 L108,108 L0,108 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M28,36 C28,31.58 31.58,28 36,28 L72,28 C76.42,28 80,31.58 80,36 L80,72 C80,76.42 76.42,80 72,80 L36,80 C31.58,80 28,76.42 28,72 Z" />
              <path
                  android:fillColor="#6CDBAC"
                  android:pathData="M62,48 L82,48 C84.21,48 86,49.79 86,52 L86,56 C86,58.21 84.21,60 82,60 L62,60 C58.69,60 56,57.31 56,54 C56,50.69 58.69,48 62,48 Z" />
              <path
                  android:fillColor="#005A3F"
                  android:pathData="M35,68 L41,68 L41,56 L35,56 Z M44,68 L50,68 L50,48 L44,48 Z M53,68 L59,68 L59,40 L53,40 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/java/com/hisabbondhu/app/MainActivity.kt
          package com.hisabbondhu.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.print.PrintAttributes
          import android.print.PrintManager
          import android.provider.MediaStore
          import android.webkit.*
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private var fileUploadCallback: ValueCallback<Array<Uri>>? = null

              private val fileChooserLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val uri = result.data?.data
                  if (result.resultCode == RESULT_OK && uri != null) {
                      fileUploadCallback?.onReceiveValue(arrayOf(uri))
                  } else {
                      fileUploadCallback?.onReceiveValue(null)
                  }
                  fileUploadCallback = null
              }

              private val notifPermLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  createNotificationChannel()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          notifPermLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)
                      }
                  }

                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      loadWithOverviewMode = true
                      useWideViewPort = true
                      setSupportZoom(false)
                  }

                  webView.addJavascriptInterface(AndroidBridge(), "AndroidBridge")
                  webView.webViewClient = WebViewClient()

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          fileUploadCallback?.onReceiveValue(null)
                          fileUploadCallback = filePathCallback
                          val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                          }
                          fileChooserLauncher.launch(Intent.createChooser(intent, "Select Backup JSON File"))
                          return true
                      }
                  }

                  webView.loadUrl("file:///android_asset/index.html")

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          webView.evaluateJavascript("handleAndroidBack()") { result ->
                              if (result != "true") {
                                  finish()
                              }
                          }
                      }
                  })
              }

              private fun createNotificationChannel() {
                  val channel = NotificationChannel(
                      "hisabbondhu_channel",
                      "HisabBondhu Reminders",
                      NotificationManager.IMPORTANCE_HIGH
                  )
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(channel)
              }

              inner class AndroidBridge {

                  @JavascriptInterface
                  fun saveFile(filename: String, content: String, mimeType: String) {
                      runOnUiThread {
                          try {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  val values = ContentValues().apply {
                                      put(MediaStore.Downloads.DISPLAY_NAME, filename)
                                      put(MediaStore.Downloads.MIME_TYPE, mimeType)
                                      put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                                  }
                                  val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                                  if (uri != null) {
                                      contentResolver.openOutputStream(uri)?.use { out ->
                                          out.write(content.toByteArray(Charsets.UTF_8))
                                      }
                                  }
                              } else {
                                  val dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                                  val file = File(dir, filename)
                                  FileOutputStream(file).use { out ->
                                      out.write(content.toByteArray(Charsets.UTF_8))
                                  }
                              }
                              Toast.makeText(
                                  this@MainActivity,
                                  "Saved to Downloads: $filename",
                                  Toast.LENGTH_LONG
                              ).show()
                          } catch (e: Exception) {
                              Toast.makeText(
                                  this@MainActivity,
                                  "Error saving file: ${e.message}",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun printPdfReport() {
                      runOnUiThread {
                          val printManager = getSystemService(Context.PRINT_SERVICE) as PrintManager
                          val jobName = "HisabBondhu_Financial_Report"
                          val printAdapter = webView.crpZEAWYtiB6bJ16NuLbGCc6CZ6jJdKfb63(jobName)
                          printManager.print(jobName, printAdapter, PrintAttributes.Builder().build())
                      }
                  }

                  @JavascriptInterface
                  fun showNotification(title: String, message: String) {
                      runOnUiThread {
                          val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                          val notif = NotificationCompat.Builder(this@MainActivity, "hisabbondhu_channel")
                              .setSmallIcon(R.mipmap.ic_launcher)
                              .setContentTitle(title)
                              .setContentText(message)
                              .setPriority(NotificationCompat.PRIORITY_HIGH)
                              .setAutoCancel(true)
                              .build()
                          nm.notify((System.currentTimeMillis() % 10000).toInt(), notif)
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="bn">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>HisabBondhu Pro (হিসাববন্ধু)</title>
          <style>
            :root {
              --primary: #006C4C;
              --primary-light: #008960;
              --primary-dark: #003826;
              --income: #10B981;
              --income-bg: rgba(16, 185, 129, 0.12);
              --expense: #EF4444;
              --expense-bg: rgba(239, 68, 68, 0.12);
              --debtor: #0EA5E9;
              --debtor-bg: rgba(14, 165, 233, 0.12);
              --creditor: #F59E0B;
              --creditor-bg: rgba(245, 158, 11, 0.14);
              --bg: #F1F6F4;
              --card: #FFFFFF;
              --text: #0F172A;
              --muted: #64748B;
              --border: #E2E8F0;
              --shadow: 0 8px 24px rgba(0, 56, 38, 0.06);
            }
            body.dark {
              --primary: #34D399;
              --primary-light: #10B981;
              --primary-dark: #064E3B;
              --bg: #0B1110;
              --card: #151F1C;
              --text: #F1F5F9;
              --muted: #94A3B8;
              --border: #23332E;
              --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            }
            * {
              box-sizing: border-box;
              font-family: 'Segoe UI', system-ui, -apple-system, 'Noto Sans Bengali', sans-serif;
              -webkit-tap-highlight-color: transparent;
            }
            body {
              margin: 0; background: var(--bg); color: var(--text);
              padding-bottom: 92px; transition: background 0.25s, color 0.25s;
            }
            header {
              background: var(--card); color: var(--text); padding: 14px 16px;
              display: flex; justify-content: space-between; align-items: center;
              position: sticky; top: 0; z-index: 40; border-bottom: 1px solid var(--border);
            }
            .brand-wrap { display: flex; align-items: center; gap: 10px; }
            .brand-logo {
              width: 38px; height: 38px; border-radius: 12px;
              background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
              display: flex; align-items: center; justify-content: center;
              color: #fff; font-weight: 800; font-size: 18px;
            }
            header h1 { margin: 0; font-size: 17px; font-weight: 800; }
            header small { display: block; font-size: 11px; color: var(--muted); }
            .header-actions { display: flex; gap: 6px; }
            .icon-btn {
              background: var(--bg); color: var(--text); border: 1px solid var(--border);
              padding: 7px 11px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer;
            }
            .container { padding: 14px; max-width: 720px; margin: 0 auto; }
            .hero-wrapper {
              background: linear-gradient(135deg, #005A3F 0%, #00291D 100%);
              color: #fff; border-radius: 22px; padding: 18px; margin-bottom: 14px;
              box-shadow: 0 12px 28px rgba(0, 90, 63, 0.25);
            }
            .hero-main-bal small { font-size: 12px; opacity: 0.85; }
            .hero-main-bal h2 { margin: 4px 0 6px 0; font-size: 30px; font-weight: 800; }
            .hero-pure-tag {
              display: inline-block; background: rgba(255, 255, 255, 0.14);
              padding: 3px 9px; border-radius: 20px; font-size: 11px; margin-bottom: 12px;
            }
            .hero-side-ledger {
              display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
              width: 100%; margin-top: 6px; padding-top: 12px;
              border-top: 1px solid rgba(255,255,255,0.14);
            }
            .glass-box {
              background: rgba(255, 255, 255, 0.1);
              border: 1px solid rgba(255, 255, 255, 0.16);
              border-radius: 14px; padding: 10px 12px;
            }
            .glass-box small { font-size: 11px; opacity: 0.85; display: block; }
            .glass-box strong { font-size: 16px; display: block; margin-top: 3px; }
            .text-cyan { color: #7DD3FC; }
            .text-amber { color: #FDE047; }
            .section-head {
              display: flex; justify-content: space-between; align-items: center;
              margin: 14px 2px 8px 2px;
            }
            .section-head strong { font-size: 14px; }
            .section-head span { font-size: 12px; color: var(--primary); font-weight: 600; cursor: pointer; }
            .wallet-strip {
              display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none;
            }
            .wallet-strip::-webkit-scrollbar { display: none; }
            .wallet-pill {
              min-width: 132px; background: var(--card); border: 1px solid var(--border);
              border-radius: 16px; padding: 12px; box-shadow: var(--shadow); flex-shrink: 0;
            }
            .wallet-pill .w-badge {
              width: 28px; height: 28px; border-radius: 8px;
              display: flex; align-items: center; justify-content: center;
              font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 8px;
            }
            .wallet-pill small { font-size: 11px; color: var(--muted); display: block; }
            .wallet-pill strong { font-size: 15px; display: block; margin-top: 2px; }
            .card {
              background: var(--card); border: 1px solid var(--border);
              border-radius: 18px; padding: 15px; margin-bottom: 12px; box-shadow: var(--shadow);
            }
            .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
            .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
            .stat-card {
              padding: 13px; border-radius: 16px; border: 1px solid var(--border); background: var(--card);
            }
            .stat-inc { color: var(--income); font-weight: 800; font-size: 18px; }
            .stat-exp { color: var(--expense); font-weight: 800; font-size: 18px; }
            .action-tile {
              background: var(--card); border: 1px solid var(--border);
              border-radius: 14px; padding: 10px 6px; text-align: center; cursor: pointer;
            }
            .action-tile .a-icon {
              width: 36px; height: 36px; border-radius: 10px; margin: 0 auto 6px auto;
              display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;
            }
            .action-tile span { font-size: 11px; font-weight: 600; display: block; }
            .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
            .chip {
              border: 1px solid var(--border); background: var(--card); color: var(--text);
              padding: 6px 13px; border-radius: 20px; font-size: 12px; font-weight: 600;
              white-space: nowrap; cursor: pointer;
            }
            .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
            input, select {
              width: 100%; padding: 11px 12px; margin-top: 5px; margin-bottom: 10px;
              border-radius: 12px; border: 1px solid var(--border);
              background: var(--bg); color: var(--text); font-size: 14px;
            }
            .btn {
              background: var(--primary); color: #fff; border: none; padding: 12px 16px;
              border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; font-size: 14px;
            }
            .btn-outline {
              background: transparent; color: var(--text); border: 1px solid var(--border);
              padding: 7px 11px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 600;
            }
            .btn-danger {
              background: var(--expense-bg); color: var(--expense); border: none;
              padding: 6px 10px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 12px;
            }
            .tx-row {
              display: flex; justify-content: space-between; align-items: center;
              padding: 11px 0; border-bottom: 1px solid var(--border); gap: 10px;
            }
            .tx-row:last-child { border-bottom: none; }
            .badge {
              display: inline-block; padding: 3px 8px; border-radius: 8px; font-size: 11px; font-weight: 700;
            }
            .badge-debtor { background: var(--debtor-bg); color: var(--debtor); }
            .badge-creditor { background: var(--creditor-bg); color: var(--creditor); }
            .progress-bar { width: 100%; height: 9px; background: var(--border); border-radius: 9px; overflow: hidden; margin: 8px 0; }
            .progress-fill { height: 100%; background: var(--income); transition: width 0.35s ease; }
            .fab {
              position: fixed; right: 18px; bottom: 76px;
              width: 54px; height: 54px; border-radius: 18px;
              background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
              color: #fff; border: none; font-size: 26px; font-weight: 700;
              box-shadow: 0 8px 20px rgba(0, 108, 76, 0.4);
              cursor: pointer; z-index: 45; display: flex; align-items: center; justify-content: center;
            }
            .bottom-nav {
              position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
              border-top: 1px solid var(--border); display: flex; justify-content: space-around;
              padding: 9px 0; z-index: 45;
            }
            .bottom-nav button {
              background: none; border: none; color: var(--muted); font-size: 11px;
              display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
            }
            .bottom-nav button.active { color: var(--primary); font-weight: 800; }
            .nav-ico { font-size: 17px; }
            .modal-backdrop {
              position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
              z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px;
            }
            .modal-box {
              background: var(--card); color: var(--text); border-radius: 20px;
              max-width: 420px; width: 100%; padding: 18px;
              box-shadow: 0 20px 40px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto;
            }
            #toastBar {
              position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
              background: #1E293B; color: #fff; padding: 10px 18px; border-radius: 30px;
              font-size: 13px; font-weight: 600; z-index: 500;
            }
            .hidden { display: none !important; }
