name: Build HisabBondhu Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # এটি থাকলে আপনি যেকোনো সময় ১ ক্লিকে ম্যানুয়ালি Build চালাতে পারবেন

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile & Sign HisabBondhu APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK (API 35)
        uses: android-actions/setup-android@v3

      - name: 4. Auto-Create gradle.properties & proguard-rules.pro (If Missing)
        run: |
          if [ ! -f gradle.properties ]; then
            cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF
          fi
          mkdir -p app
          if [ ! -f app/proguard-rules.pro ]; then
            touch app/proguard-rules.pro
          fi

      - name: 5. Install Gradle 8.7 (No gradlew / wrapper.jar required)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 6. Build Installable Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 7. Prepare Ready-to-Install APK File
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/HisabBondhu-v1.0.0.apk

      - name: 8. Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HisabBondhu-Installable-APK
          path: output_apk/HisabBondhu-v1.0.0.apk
          if-no-files-found: error

      - name: 9. Publish APK to GitHub Releases Automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "HisabBondhu APK Build #${{ github.run_number }}"
          body: "হিসাববন্ধু (HisabBondhu) অ্যাপের সরাসরি ইনস্টলযোগ্য অ্যান্ড্রয়েড APK ফাইল। নিচের Assets থেকে HisabBondhu-v1.0.0.apk ডাউনলোড করে ফোনে ইনস্টল করুন।"
          files: output_apk/HisabBondhu-v1.0.0.apk
